# font_family      FiraCode Nerd Font Mon
# font_family      xos4 Terminus
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

disable_ligatures always
font_size 11
window_padding_width 3
background_opacity 1
shell_integration no-title
hide_window_decorations no
#confirm_os_window_close 0
#linux_display_server x11
close_on_child_death yes
enable_audio_bell no
cursor_shape beam
paste_actions filter
clipboard_control write-clipboard write-primary read-clipboard read-primary
remember_window_size no

initial_window_height 25c
initial_window_width 100c

map ctrl+shift+z send_text all \u0019
map ctrl+tab send_text all \u001B[27;5;9~
map ctrl+shift+tab send_text all \u001B[27;6;9~
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C

# BEGIN_KITTY_THEME
# Adwaita dark
include retro.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="AcPlusToshibaSat9x 14 Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
