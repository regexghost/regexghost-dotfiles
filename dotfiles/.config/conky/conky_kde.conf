conky.config = {
    alignment = 'top_right',
    background = false,
    own_window_colour = '1d1d1d',
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = true,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'Departure Mono:size=10',
    font2 = 'Departure Mono:style=bold:size=10',
    font3 = 'Departure Mono:style=bold:size=11',
    font4 = 'Font Awesome 7 Free Solid:style=Regular:size=9',
    gap_x = 16,
    gap_y = 16,
    minimum_height = 5,
    minimum_width = 5,
    -- imlib_cache_size = 0,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = false,
    out_to_wayland = true,
    own_window = true,
    own_window_type = 'dock',
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_value = 225,
    show_graph_range = false,
    show_graph_scale = true,
    stippled_borders = 4.0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    --minimum_height=1000,
    
    border_inner_margin = 10,
      
    color0 = 'ed333b',
    color1 = 'ee2e24',
    color2 = '1dc300',
    color3 = 'ffd204',
    color4 = '009ddc',
    color5 = 'ee2e24',
    color6 = 'ee2e24',
    color7 = 'ffffff',
    color8 = '737171',
    color9 = 'ee2e24',
}


conky.text = [[
${color8}Info:${color} Arch (${no_update $kernel})
$hr
${color8}Time:$color ${time %H:%M:%S %a %d %b (%Z)}
${color8}New York:       Seoul:${color}
${tztime America/New_York %H:%M:%S (%Z)}  ${tztime Asia/Seoul %H:%M:%S (%Z)}
${color8}Script:$color ${execi 600 ~/.config/regexghost/conky_script.sh}
${color8}Script:$color ${execi 600 ~/.config/regexghost/conky_script.sh -2}
${color1}${font3}System${font}$color ${hr 2}
${color8}Uptime:$color $uptime_short (${execi 1000 uptime -s | sed 's/^..//g' | sed 's/:[0-9]\{2\}$//g'})
${color8}1m: $color${loadavg 1} ${color8}5m: $color${loadavg 2} ${color8}15m: $color${loadavg 3}
${color8}CPU Temperature:${color} ${execi 2 cat /sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon2/temp1_input | cut -c 1-2}°C
${color8}CPU Util:${color} ${cpu}% (${freq_g 0}GHz)
${cpugraph 1dc300 ee2e24 -t}
${color2}${font3}Memory${font}$color ${hr 2}
${color8}Usage:${color} ${mem}/${memmax}
${color8}Name:           PID:     Memory:${color}
${top_mem name 1}${alignc}${top_mem pid 1}${alignr}${top_mem mem_res 1}
${top_mem name 2}${alignc}${top_mem pid 2}${alignr}${top_mem mem_res 2}
${top_mem name 3}${alignc}${top_mem pid 3}${alignr}${top_mem mem_res 3}
${top_mem name 4}${alignc}${top_mem pid 4}${alignr}${top_mem mem_res 4}
${color3}${font3}Network${font}$color ${hr 2}
${color8}IP (Local):${color} ${addr wlp4s0}
${color8}Down:${color} ${downspeed wlp4s0}/s${alignr}${color8}Up:${color} ${upspeed wlp4s0}/s
${downspeedgraph wlp4s0 25,124 1dc300 ee2e24 -t}${alignc} ${upspeedgraph wlp4s0 25,124 1dc300 ee2e24 -t}
${color8}Recv:${color} ${totaldown wlp4s0}${alignr}${color8}Sent:${color} ${totalup wlp4s0}
${color4}${font3}Disk${font}$color ${hr 2}
${color8}Storage:${color} ${color9}U: ${color}${fs_used /}  ${color2}F: ${color}${fs_free /}
${color8}Buffered:${color} ${execi 2 grep -e Dirty -e Writeback /proc/meminfo | tr -s " " | cut -d " " -f 2 | awk '{sum+=$1} END {printf "%d MiB", sum/1024}'}
${color8}Root Disk:${color} ${diskio /dev/nvme0n1}/s
${diskiograph /dev/nvme0n1 1dc300 ee2e24 -t}${if_existing /dev/sdb}
${color8}/dev/sdb:${color} ${diskio /dev/sdb}/s
${diskiograph /dev/sdb 1dc300 ee2e24 -t}${endif}${if_existing /dev/sdc}
${color8}/dev/sdc:${color} ${diskio /dev/sdc}/s
${diskiograph /dev/sdc 1dc300 ee2e24 -t}${endif}
${color2}${font3}Other${font}$color ${hr 2}
${color8}Weather:${color}
${execp cat /home/USERNAME/.local/share/regexghost/kde/weather_conky.txt}
${color8}Sunset:${color}
${execp cat /home/USERNAME/.local/share/regexghost/kde/sunset_conky.txt}
${color8}Sunrise:${color}
${execp cat /home/USERNAME/.local/share/regexghost/kde/sunrise_conky.txt}${voffset 10}
]]

-- ${color8}CPU:${color} ${execi 10000 cat /proc/cpuinfo | grep 'model name' | head -n 1 | sed -e 's/model name.*: //' | sed 's/([^)]*)//g' | sed 's/Intel Core //g'} @ ${execi 10000 cat /sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq | awk '{ printf"%0.1f", $1/1000000}'}GHz
--${color8}${font Robot Mono:style=bold}Frequency (GHz):${font}$color $freq_g
--${color8}RAM Usage:$color $mem/$memmax - $memperc% ${membar 4}
--${color8}Swap Usage:$color $swap/$swapmax - $swapperc% ${swapbar 4}
--${color8}CPU Usage:$color $cpu% ${cpubar 4}
--${color8}Processes:$color $processes  ${color8}Running:$color $running_processes
--$hr
--${color8}File systems:
-- / $color${fs_used /}/${fs_size /} ${fs_bar 6 /}
--${color8}Networking:
--Up:$color ${upspeed} ${color8} - Down:$color ${downspeed}
--$hr
--${color8}Name              PID     CPU%   MEM%
--${color lightgrey} ${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
--${color lightgrey} ${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
--${color lightgrey} ${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
--${color lightgrey} ${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}
--$hr
--${hwmon 5 temp 1}°C
--]]
-- IMAGE CACHE FLUSH OPTION
